name: Marco
options:
  bundleIdPrefix: com.dee.marco.draft
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig

packages:
  MarcoCore:
    path: Packages/MarcoCore
  MarcoRendering:
    path: Packages/MarcoRendering
  swift-markdown:
    url: https://github.com/apple/swift-markdown.git
    from: 0.6.0
  Highlightr:
    url: https://github.com/raspu/Highlightr.git
    from: 2.2.0

targets:
  Marco:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: App/Sources/Marco
        excludes:
          - "Resources/**"
      - path: App/Sources/Marco/Resources
        buildPhase: resources
    dependencies:
      - package: MarcoCore
      - package: MarcoRendering
      - package: Highlightr
      - target: MarcoQuickLook
        embed: true
    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        MARKETING_VERSION: $(MARKETING_VERSION)
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Sources/Marco/Info.plist
      properties:
        CFBundleDisplayName: $(APP_NAME)
        CFBundleName: $(APP_NAME)
        CFBundleIconName: AppIcon
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: ""
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes:
              - net.daringfireball.markdown
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
                - mdown
    entitlements:
      path: App/Sources/Marco/Marco.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.print: true
        # M6 Phase 0 spike-only, narrow read-only exception (see
        # App/Sources/Marco/Spike) so the headless bench harness can read
        # the generated perf fixtures by absolute path without an open
        # panel. Sandbox stays on otherwise. Remove once the spike is done
        # (same pattern as M0 Spike A, PLAN §8).
        com.apple.security.temporary-exception.files.absolute-path.read-only:
          - /path/to/typeset/Tests/Fixtures/generated/
  MarcoQuickLook:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: App/Sources/MarcoQuickLook
    dependencies:
      - package: MarcoCore
      - package: MarcoRendering
    settings:
      base:
        PRODUCT_NAME: MarcoQuickLook
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).quicklook
        MARKETING_VERSION: $(MARKETING_VERSION)
        SWIFT_EMIT_LOC_STRINGS: NO
        SKIP_INSTALL: YES
    info:
      path: App/Sources/MarcoQuickLook/Info.plist
      properties:
        CFBundleDisplayName: $(APP_NAME) Quick Look
        NSHumanReadableCopyright: ""
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: PreviewViewController
        QLSupportedContentTypes:
          - net.daringfireball.markdown
        QLSupportsSearchableItems: false
    entitlements:
      path: App/Sources/MarcoQuickLook/MarcoQuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
  MarcoTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: App/Tests/MarcoTests
    dependencies:
      - target: Marco
      - package: MarcoRendering
    settings:
      base:
        SWIFT_EMIT_LOC_STRINGS: NO
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Marco:
    build:
      targets:
        Marco: all
        MarcoQuickLook: all
        MarcoTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: MarcoTests
    run:
      config: Debug
