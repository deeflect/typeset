name: Typeset
options:
  bundleIdPrefix: com.deeflect
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig

packages:
  TypesetCore:
    path: Packages/TypesetCore
  TypesetRendering:
    path: Packages/TypesetRendering
  swift-markdown:
    url: https://github.com/apple/swift-markdown.git
    exactVersion: 0.8.0
  swift-cmark:
    url: https://github.com/swiftlang/swift-cmark.git
    exactVersion: 0.8.0
  Highlightr:
    url: https://github.com/raspu/Highlightr.git
    exactVersion: 2.3.0

targets:
  Typeset:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: App/Sources/Typeset
        excludes:
          - "Resources/**"
      - path: App/Sources/Typeset/Resources
        buildPhase: resources
    dependencies:
      - package: TypesetCore
      - package: TypesetRendering
      - package: Highlightr
      - target: TypesetQuickLook
        embed: true
    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)
        PRODUCT_MODULE_NAME: Typeset
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        MARKETING_VERSION: $(MARKETING_VERSION)
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Sources/Typeset/Info.plist
      properties:
        CFBundleDisplayName: $(APP_NAME)
        CFBundleName: $(APP_NAME)
        CFBundleIconName: AppIcon
        # Without these the generated Info.plist keeps XcodeGen's default 1.0
        # and Config/App.xcconfig's MARKETING_VERSION is silently ignored —
        # so the documented "rename/version in one place" story didn't hold,
        # and App Store builds would carry the wrong version.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: $(APP_COPYRIGHT)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes:
              - net.daringfireball.markdown
              - org.mdxjs.mdx
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
                - mdown
          # No system or common third-party UTI for .mdx exists; named after mdxjs.com so
          # another app importing the same id agrees with us.
          - UTTypeIdentifier: org.mdxjs.mdx
            UTTypeDescription: MDX Document
            UTTypeConformsTo:
              - net.daringfireball.markdown
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - mdx
    entitlements:
      path: App/Sources/Typeset/Typeset.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.print: true
        # NOTE: no temporary-exception entitlement. A read-only absolute-path
        # exception for the M6 spike's perf fixtures used to live here and was
        # shipping in Release — it hard-coded a developer's local checkout path
        # into the signed binary and would draw an App Store review question
        # for no user-facing benefit. The headless benches read fixtures via
        # the unsandboxed copy Scripts/snapshot.sh already builds.
  TypesetQuickLook:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: App/Sources/TypesetQuickLook
        excludes:
          - "Resources/**"
      - path: App/Sources/TypesetQuickLook/Resources
        buildPhase: resources
    dependencies:
      - package: TypesetCore
      - package: TypesetRendering
    settings:
      base:
        PRODUCT_NAME: TypesetQuickLook
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).quicklook
        MARKETING_VERSION: $(MARKETING_VERSION)
        SWIFT_EMIT_LOC_STRINGS: NO
        SKIP_INSTALL: YES
        # TestFlight rejects bundles without an embedded profile (ITMS-90889).
        PROVISIONING_PROFILE_REQUIRED: YES
    info:
      path: App/Sources/TypesetQuickLook/Info.plist
      properties:
        CFBundleDisplayName: $(APP_NAME) Quick Look
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: $(APP_COPYRIGHT)
        # QLSupportedContentTypes / QLSupportsSearchableItems must live inside
        # NSExtensionAttributes. At the plist root — where they were — Quick
        # Look never learns which types this extension claims, so it silently
        # skipped it and fell back to the built-in plain-text previewer, which
        # is why Space on a .md file showed raw Markdown.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          # Swift class names are module-qualified; a bare name never resolves
          # and Quick Look spins forever (QLPreviewExtensionViewController assert).
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - net.daringfireball.markdown
              - org.mdxjs.mdx
            QLSupportsSearchableItems: false
    entitlements:
      path: App/Sources/TypesetQuickLook/TypesetQuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
  TypesetTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: App/Tests/TypesetTests
    dependencies:
      - target: Typeset
      - package: TypesetRendering
      - package: TypesetCore
    settings:
      base:
        SWIFT_EMIT_LOC_STRINGS: NO
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/$(APP_NAME).app/Contents/MacOS/$(APP_NAME)
  TypesetQuickLookTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: App/Sources/TypesetQuickLook/PreviewViewController.swift
      - path: App/Tests/TypesetQuickLookTests
    dependencies:
      - package: TypesetCore
      - package: TypesetRendering
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Typeset:
    build:
      targets:
        Typeset: all
        TypesetQuickLook: all
        TypesetTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: TypesetTests
        - name: TypesetQuickLookTests
    run:
      config: Debug
